[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jatoba"
version = "1.1.0"
description = "JATOBÁ: typed probabilistic decisions (NOUL, CHOICE, SCORE) over variable candidate sets in Brazilian Portuguese"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Leonardo Vilela" }]
dependencies = ["torch>=2.2", "transformers>=4.48,<5"]

[project.optional-dependencies]
benchmark = ["datasets>=3.0", "huggingface_hub>=0.24", "pandas>=2.0", "pyarrow>=14", "requests>=2.31"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/LeonardoVilela/jatoba-decision"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_launch_figure.py" = ["E501"]  # the caption is a Markdown template
